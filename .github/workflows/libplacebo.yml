name: libplacebo optional backend

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/libplacebo.yml"
      - "xmake.lua"
      - "xmake-packages/**"
      - "src/frameConverter.cpp"
      - "src/placeboBackend*.h"
      - "src/placeboBackend*.cpp"
      - "backends/placebo/**"
      - "tools/placebo-loader-smoke.cpp"
      - "tools/placebo-render-smoke.cpp"
      - "vcpkg-overlays/libplacebo/**"
      - "tools/install-libplacebo-vcpkg.ps1"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/libplacebo.yml"
      - "xmake.lua"
      - "xmake-packages/**"
      - "src/frameConverter.cpp"
      - "src/placeboBackend*.h"
      - "src/placeboBackend*.cpp"
      - "backends/placebo/**"
      - "tools/placebo-loader-smoke.cpp"
      - "tools/placebo-render-smoke.cpp"
      - "vcpkg-overlays/libplacebo/**"
      - "tools/install-libplacebo-vcpkg.ps1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XMAKE_PKG_CACHEDIR: ${{ github.workspace }}\.xmake-cache
  XMAKE_PKG_INSTALLDIR: ${{ github.workspace }}\.xmake-packages
  VCPKG_ROOT: C:\vcpkg
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\vcpkg-overlays
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows

jobs:
  build:
    name: core + optional libplacebo backend
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache Xmake downloads
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\.xmake-cache
          key: ${{ runner.os }}-${{ runner.arch }}-xmake-downloads
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xmake-

      - name: Cache Xmake packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\.xmake-packages
          key: ${{ runner.os }}-${{ runner.arch }}-msvc-xmake-pkgs-vulkan2-${{ hashFiles('xmake.lua', 'xmake-packages/**/*.lua') }}

      - name: verify optional-backend sources
        run: |
          $required = @(
            ".\backends\placebo\placeboBackend.cpp",
            ".\backends\placebo\placeboLibav.c",
            ".\src\placeboBackendApi.h",
            ".\tools\placebo-loader-smoke.cpp",
            ".\tools\placebo-render-smoke.cpp"
          )

          $missing = @(
            $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          )

          if ($missing.Count -ne 0) {
            throw "Required optional-backend source file(s) missing from checkout: $($missing -join ', ')"
          }

      - name: build core without libplacebo package
        run: |
          xmake config -y -vD `
            --mode=releasedbg `
            --toolchain=msvc `
            --libplacebo_mode=runtime
          xmake build -y -vD f4ffmpeg

      - name: install static libplacebo with vcpkg
        run: .\tools\install-libplacebo-vcpkg.ps1

      - name: verify libplacebo Vulkan capability
        run: |
          $config = Join-Path $env:VCPKG_ROOT "installed\$env:VCPKG_DEFAULT_TRIPLET\include\libplacebo\config.h"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "libplacebo config.h was not installed"
          }
          if (-not (Select-String -LiteralPath $config -Pattern '^#define PL_HAVE_VULKAN 1$' -Quiet)) {
            throw "libplacebo was not built with Vulkan support"
          }
          if (-not (Select-String -LiteralPath $config -Pattern '^#define PL_HAVE_GLSLANG 1$' -Quiet)) {
            throw "libplacebo was not built with glslang support"
          }
          if (Select-String -LiteralPath $config -Pattern '^#define PL_HAVE_D3D11 1$' -Quiet) {
            throw "libplacebo unexpectedly built its unused D3D11 backend"
          }
      - name: reset Xmake package install cache before static backend
        run: |
          if (Test-Path -LiteralPath $env:XMAKE_PKG_INSTALLDIR) {
            Remove-Item -LiteralPath $env:XMAKE_PKG_INSTALLDIR -Recurse -Force
          }

      - name: configure optional backend
        id: static_config
        continue-on-error: true
        run: |
          xmake config -y -vD `
            --mode=releasedbg `
            --toolchain=msvc `
            --libplacebo_mode=static

      - name: capture FFmpeg configure proof
        if: steps.static_config.outcome == 'failure'
        run: |
          $proof = Join-Path $env:GITHUB_WORKSPACE "ffmpeg-config-proof"
          New-Item -ItemType Directory -Force -Path $proof | Out-Null

          $roots = @(
            (Join-Path $env:TEMP ".xmake"),
            (Join-Path $env:LOCALAPPDATA ".xmake"),
            $env:GITHUB_WORKSPACE
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }

          $logs = @(
            foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -Recurse -Filter "config.log" -File -ErrorAction SilentlyContinue
            }
          )

          if ($logs.Count -eq 0) {
            "No FFmpeg config.log was found." | Set-Content -LiteralPath (Join-Path $proof "missing.txt")
          } else {
            $index = 0
            foreach ($log in $logs) {
              $index++
              $destination = Join-Path $proof ("config-{0}.log" -f $index)
              Copy-Item -LiteralPath $log.FullName -Destination $destination
              "SOURCE=$($log.FullName)" | Add-Content -LiteralPath (Join-Path $proof "locations.txt")
              Get-Content -LiteralPath $log.FullName -Tail 250
            }
          }

      - name: upload FFmpeg configure proof
        if: steps.static_config.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-proof
          path: ffmpeg-config-proof/
          if-no-files-found: error
          retention-days: 7

      - name: fail if static configuration failed
        if: steps.static_config.outcome == 'failure'
        run: throw "Static libplacebo configuration failed. See ffmpeg-config-proof."

      - name: build core with static-backend configuration
        run: xmake build -y -vD f4ffmpeg

      - name: build optional libplacebo backend
        run: xmake build -y -vD f4ffmpeg_placebo

      - name: build backend loader smoke test
        run: xmake build -y -vD placebo-loader-smoke

      - name: build backend render smoke test
        run: xmake build -y -vD placebo-render-smoke

      - name: smoke-load optional backend
        run: |
          $backend = Get-ChildItem `
            -Path "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "f4ffmpeg_placebo.dll" `
            -File `
            -ErrorAction Stop |
            Select-Object -First 1

          $smoke = Get-ChildItem `
            -Path "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "placebo-loader-smoke.exe" `
            -File `
            -ErrorAction Stop |
            Select-Object -First 1

          if (-not $backend) {
            throw "f4ffmpeg_placebo.dll was not produced"
          }

          if (-not $smoke) {
            throw "placebo-loader-smoke.exe was not produced"
          }

          Write-Host "Smoke loading $($backend.FullName)"
          & $smoke.FullName $backend.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "libplacebo backend smoke test failed with exit code $LASTEXITCODE"
          }

      - name: smoke-render one frame through optional backend
        run: |
          $backend = Get-ChildItem `
            -Path "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "f4ffmpeg_placebo.dll" `
            -File `
            -ErrorAction Stop |
            Select-Object -First 1

          $smoke = Get-ChildItem `
            -Path "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "placebo-render-smoke.exe" `
            -File `
            -ErrorAction Stop |
            Select-Object -First 1

          if (-not $backend) {
            throw "f4ffmpeg_placebo.dll was not produced"
          }

          if (-not $smoke) {
            throw "placebo-render-smoke.exe was not produced"
          }

          Write-Host "Rendering one WARP D3D11 frame through $($backend.FullName)"
          & $smoke.FullName $backend.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "libplacebo backend render smoke failed with exit code $LASTEXITCODE"
          }

      - name: locate core plugin
        id: core
        run: |
          $plugin = Get-ChildItem `
            -Path "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "f4ffmpeg.dll" `
            -File `
            -ErrorAction Stop |
            Where-Object { $_.Name -ne "f4ffmpeg_placebo.dll" } |
            Select-Object -First 1

          if (-not $plugin) {
            throw "f4ffmpeg.dll was not produced"
          }

          "path=$($plugin.FullName)" >> $env:GITHUB_OUTPUT

      - name: locate optional backend
        id: backend
        run: |
          $backend = Get-ChildItem `
            -Path "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "f4ffmpeg_placebo.dll" `
            -File `
            -ErrorAction Stop |
            Select-Object -First 1

          if (-not $backend) {
            throw "f4ffmpeg_placebo.dll was not produced"
          }

          "path=$($backend.FullName)" >> $env:GITHUB_OUTPUT

      - name: locate optional backend symbols
        id: backend_symbols
        run: |
          $pdb = Get-ChildItem `
            -Path "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "f4ffmpeg_placebo.pdb" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($pdb) {
            "path=$($pdb.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            "path=" >> $env:GITHUB_OUTPUT
          }

      - name: upload core plugin
        uses: actions/upload-artifact@v4
        with:
          name: f4ffmpeg-core-releasedbg
          path: ${{ steps.core.outputs.path }}
          if-no-files-found: error

      - name: upload optional libplacebo backend
        uses: actions/upload-artifact@v4
        with:
          name: f4ffmpeg-libplacebo-backend-releasedbg
          path: ${{ steps.backend.outputs.path }}
          if-no-files-found: error

      - name: upload optional libplacebo backend symbols
        if: steps.backend_symbols.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: f4ffmpeg-libplacebo-backend-symbols-releasedbg
          path: ${{ steps.backend_symbols.outputs.path }}
          if-no-files-found: warn
